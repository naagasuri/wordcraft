<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: draw under the iPad's rounded corners / home indicator; the safe-area
       insets below keep the UI clear of them. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>WordCraft</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/wordcraft.ico" />
  <link data-trunk rel="rust" data-bin="wordcraft-web" data-wasm-opt="z" data-weak-refs />

  <!-- iPad / iPhone: "Add to Home Screen" opens full screen like an installed app. -->
  <link data-trunk rel="copy-dir" href="pwa" />
  <link data-trunk rel="copy-file" href="sw.js" />
  <link rel="manifest" href="pwa/manifest.webmanifest">
  <link rel="apple-touch-icon" href="pwa/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WordCraft">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2b47b5">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6;
      /* iPadOS: no rubber-band bounce, no long-press callout / text magnifier over the canvas. */
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    body { position: fixed; inset: 0; }
    #wordcraft_canvas { position: absolute;
      top: env(safe-area-inset-top, 0); right: env(safe-area-inset-right, 0);
      bottom: env(safe-area-inset-bottom, 0); left: env(safe-area-inset-left, 0);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block;
      /* egui handles pan / pinch itself; stop Safari from scrolling or zooming the page instead. */
      touch-action: none; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
    @media (prefers-color-scheme: dark) { html, body { background: #1e1e1e; } #wordcraft_loading { color: #aaa; } }
  </style>
</head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading WordCraft&hellip;</div>
  <script>
    // Offline use from the home screen (needs https).
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
    }
    // iPadOS Safari ignores user-scalable=no for pinch gestures; block page zoom so egui gets them.
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
      document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
    });
    // Double-tap would zoom the page in Safari.
    var lastTouchEnd = 0;
    document.addEventListener("touchend", function (e) {
      var now = Date.now();
      if (now - lastTouchEnd < 350 && e.target && e.target.id === "wordcraft_canvas") e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
  </script>
</body>
</html>
