<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: draw under the iPad's status bar, rounded corners and home indicator;
       the safe-area insets below keep the UI clear of them. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>WordCraft</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/wordcraft.ico" />
  <link data-trunk rel="rust" data-bin="wordcraft-web" data-wasm-opt="z" data-weak-refs />

  <!-- iPad / iPhone: "Add to Home Screen" opens full screen like an installed app. -->
  <link data-trunk rel="copy-dir" href="pwa" />
  <link data-trunk rel="copy-file" href="sw.js" />
  <link rel="manifest" href="pwa/manifest.webmanifest">
  <link rel="apple-touch-icon" href="pwa/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WordCraft">
  <!-- Full screen: the app draws under a transparent status bar (clock and battery stay visible). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#e6e6e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">

  <style>
    :root { --bg: #e6e6e6; --fg: #555; --card: #ffffff; --card-fg: #222; --accent: #2b47b5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --fg: #aaa; --card: #2d2d2d; --card-fg: #eee; --accent: #4a63d9; } }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg);
      /* Native feel: no rubber-band bounce, no long-press callout / magnifier, no tap flash. */
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
    body { position: fixed; inset: 0; }
    #wordcraft_canvas { position: absolute;
      top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block; outline: none;
      /* egui handles pan / pinch itself; stop Safari from scrolling or zooming the page instead. */
      touch-action: none; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
      color: var(--fg); font: 14px -apple-system, system-ui, sans-serif; pointer-events: none; }
    #wordcraft_loading img { width: 96px; height: 96px; border-radius: 22px; }
    /* Shown only in a Safari tab, never in the installed app. */
    #wc_hint { position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; display: none; align-items: center; gap: 10px;
      max-width: calc(100% - 32px); box-sizing: border-box; padding: 10px 12px 10px 16px; border-radius: 14px;
      background: var(--card); color: var(--card-fg); font: 14px/1.35 -apple-system, system-ui, sans-serif;
      box-shadow: 0 6px 24px rgba(0,0,0,.25); -webkit-user-select: none; user-select: none; }
    #wc_hint button { white-space: nowrap; flex-shrink: 0; font: inherit; border: 0; border-radius: 9px; padding: 7px 12px; cursor: pointer; }
    #wc_hint .go { background: var(--accent); color: #fff; }
    #wc_hint .x { background: transparent; color: var(--card-fg); font-size: 18px; padding: 4px 8px; }
  </style>
</head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading"><img src="pwa/icon-180.png" alt=""><div>Loading WordCraft&hellip;</div></div>
  <div id="wc_hint" role="dialog" aria-label="Use WordCraft full screen">
    <span id="wc_hint_text"></span>
    <button class="go" id="wc_hint_go" type="button">Full screen</button>
    <button class="x" id="wc_hint_x" type="button" aria-label="Close">&times;</button>
  </div>
  <script>
    (function () {
      // Offline use and updates from the home screen (needs https). A new build ships a new sw.js,
      // which replaces the old cache; the app picks it up the next time it is opened.
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").then(function (reg) { reg.update(); }).catch(function () {});
        });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") {
            navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }).catch(function () {});
          }
        });
      }

      // iPadOS Safari ignores user-scalable=no for pinch gestures; block page zoom so egui gets them.
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
      });
      // Double-tap would zoom the page in Safari.
      var lastTouchEnd = 0;
      document.addEventListener("touchend", function (e) {
        var now = Date.now();
        if (now - lastTouchEnd < 350 && e.target && e.target.id === "wordcraft_canvas") e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
      // The on-screen keyboard can scroll the page up; keep the app pinned in place.
      window.addEventListener("scroll", function () { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); });

      // Full-screen hint, only in a browser tab (the installed app is already full screen).
      var installed = (window.matchMedia && (matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: standalone)").matches)) || navigator.standalone === true;
      var hint = document.getElementById("wc_hint");
      function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      if (installed || get("wc_hint_closed") === "1") return;
      var appleTouch = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var root = document.documentElement;
      var canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
      document.getElementById("wc_hint_text").textContent = appleTouch
        ? "For the full-screen app: tap Share, then “Add to Home Screen”."
        : "Use WordCraft full screen.";
      var go = document.getElementById("wc_hint_go");
      if (!canFs) go.style.display = "none";
      go.addEventListener("click", function () {
        var p = root.requestFullscreen ? root.requestFullscreen({ navigationUI: "hide" }) : root.webkitRequestFullscreen();
        if (p && p.catch) p.catch(function () {});
        hint.style.display = "none";
      });
      document.getElementById("wc_hint_x").addEventListener("click", function () { hint.style.display = "none"; set("wc_hint_closed", "1"); });
      setTimeout(function () { hint.style.display = "flex"; }, 2500);
      setTimeout(function () { hint.style.display = "none"; }, 20000);
    })();
  </script>
</body>
</html>
